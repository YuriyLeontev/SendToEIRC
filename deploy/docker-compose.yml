services:
  sendeirc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sendeirc
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    volumes:
      # Секреты и конфиг не вшиты в образ — монтируются снаружи
      - ../.env:/app/.env:ro
      - ../config.json:/app/config.json:ro
      # cookies.pkl должен переживать перезапуск, поэтому не :ro
      - ./data:/app/data
      # Токены ПЭС. Получить разово:
      #   touch ../pesc_tokens.json
      #   docker compose run --rm sendeirc python pesc.py --setup
      - ../pesc_tokens.json:/app/pesc_tokens.json
